[workspace]
resolver = "3"
members = [
  "pachinkox",
  "pachinkox-bin"
]

[workspace.package]
description = ""
edition = "2024"
authors = ["Tanner Weber <tannerw@pdx.edu>"]
readme = "README.md"
repository = "https://github.com/tannerweber/pachinkox"
license = "GPL-3.0-or-later"
keywords = ["simulation", "pachinko", "physics", "game"]

[workspace.dependencies]
raylib = {version = "6.0.0", features = ["wayland"]}
rand = "0.10.3"
